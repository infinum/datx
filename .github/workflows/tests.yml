name: Unit tests

on:
  push:
    branches: [master, feature/*, release/*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: 'yarn'
      - run: yarn
      - run: npm run build
      - run: npm run test
